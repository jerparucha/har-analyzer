<div class="upload-container">
  <div
    class="drop-zone"
    [class.drag-over]="isDragOver"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave()"
    (drop)="onDrop($event)"
    (click)="openPicker()"
  >
    @if (isLoading) {
      <mat-spinner diameter="48" />
      <p class="hint">Parsing HAR file…</p>
    } @else {
      <mat-icon class="upload-icon">upload_file</mat-icon>
      <h2>Drop your HAR file here</h2>
      <p class="hint">or click to browse</p>
      <p class="sub-hint">Supports .har files exported from Chrome, Firefox, Safari, or Edge DevTools</p>
    }
  </div>

  @if (error) {
    <div class="error-banner">
      <mat-icon>error_outline</mat-icon>
      <span>{{ error }}</span>
    </div>
  }

  <input
    #fileInput
    type="file"
    accept="*/*"
    class="hidden-input"
    (change)="onFileSelected($event)"
  />
</div>
